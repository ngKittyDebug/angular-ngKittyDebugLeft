<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" fill="none">
  <!--
    Original "angry bomb" NPC skin for Feeding Frenzy. A classic round cannonball bomb (the public-domain 💣 trope:
    black sphere + fuse + spark) given an angry face (V-shaped brows, glaring eyes, a gritted scowl). Deliberately a
    GENERIC angry bomb, NOT the Angry Birds "Bomb" character (no beak, no Rovio-specific eye shape / proportions) —
    Rovio's character is trademarked IP and must not be reproduced in this public repo. Licensed-clean (original art).
    The scene reddens this by CSS filter (drop-shadow red halo + saturate) as the NPC's anger/mana rises.
  -->
  <defs>
    <radialGradient id="ab-body" cx="38%" cy="32%" r="75%">
      <stop offset="0%" stop-color="#5b6470"/>
      <stop offset="38%" stop-color="#2b2f38"/>
      <stop offset="100%" stop-color="#0c0e12"/>
    </radialGradient>
    <radialGradient id="ab-spark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff6c2"/>
      <stop offset="45%" stop-color="#ffd23f"/>
      <stop offset="100%" stop-color="#ff7a18"/>
    </radialGradient>
  </defs>

  <!-- Fuse cap + curved fuse + lit spark -->
  <rect x="108" y="36" width="24" height="22" rx="5" fill="#3a3f49"/>
  <rect x="108" y="36" width="24" height="8" rx="4" fill="#535965"/>
  <path d="M120 40 C 150 18, 176 30, 170 8" stroke="#7a5230" stroke-width="7" stroke-linecap="round"/>
  <g>
    <circle cx="170" cy="8" r="13" fill="url(#ab-spark)"/>
    <circle cx="170" cy="8" r="6" fill="#fff6c2"/>
  </g>

  <!-- Bomb body -->
  <circle cx="120" cy="138" r="86" fill="url(#ab-body)"/>
  <!-- glossy highlight -->
  <ellipse cx="92" cy="104" rx="30" ry="20" fill="#ffffff" opacity="0.16"/>

  <!-- Angry brows -->
  <path d="M70 112 L112 130" stroke="#000" stroke-width="13" stroke-linecap="round"/>
  <path d="M170 112 L128 130" stroke="#000" stroke-width="13" stroke-linecap="round"/>

  <!-- Eyes (whites + pupils glaring inward) -->
  <ellipse cx="98" cy="150" rx="20" ry="23" fill="#fdfdfd"/>
  <ellipse cx="142" cy="150" rx="20" ry="23" fill="#fdfdfd"/>
  <circle cx="106" cy="153" r="9.5" fill="#15171c"/>
  <circle cx="134" cy="153" r="9.5" fill="#15171c"/>

  <!-- Gritted scowl -->
  <path d="M96 188 Q120 176 144 188" stroke="#000" stroke-width="7" stroke-linecap="round" fill="none"/>
  <path d="M104 184 L104 192 M120 181 L120 191 M136 184 L136 192" stroke="#000" stroke-width="4" stroke-linecap="round"/>
</svg>
