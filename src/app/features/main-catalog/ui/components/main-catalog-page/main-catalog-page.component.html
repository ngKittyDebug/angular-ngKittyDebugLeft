<left-paw-catalog-filter />
<div class="catalog-container">
  @if (!catalogFacade.isLoadingPokemonPaginationData()) {
    @for (item of catalogFacade.paginatedPokemonList(); track item.name) {
      @defer (on viewport) {
        <left-paw-pokemon-card [pokemonName]="item.name" />
      } @placeholder {
        <div class="empty__card">
          <tui-loader />
        </div>
      }
    }
  }
</div>
<left-paw-catalog-pagination />
