<left-paw-catalog-filter />

@if (!pokemonPaginationService.isLoadingPokemonPaginationData()) {
  <div class="catalog-container">
    @for (item of pokemonPaginationService.paginatedPokemonList(); track item.name) {
      @defer (on viewport) {
        <left-paw-pokemon-card [pokemonName]="item.name" />
      } @placeholder {
        <tui-loader />
      }
    }
  </div>
} @else {
  <tui-loader />
}
<left-paw-catalog-pagination />
