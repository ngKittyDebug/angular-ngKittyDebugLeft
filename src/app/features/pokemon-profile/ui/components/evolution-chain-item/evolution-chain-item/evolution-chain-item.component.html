<div class="card" [class.active]="evolutionChain()?.name === activeName()">
  <h3>{{ evolutionChain()?.name }}</h3>
  @if (evolutionChain()?.condition) {
    <span class="badge">{{ evolutionChain()?.condition }}</span>
  }
</div>

@if (evolutionChain()?.children?.length) {
  @if (evolutionChain()?.children!.length === 1) {
    <tui-icon icon="@tui.arrow-down" size="xs" class="arrow-icon" />
    <left-paw-evolution-chain-item
      [evolutionChain]="evolutionChain()?.children![0]"
      [activeName]="activeName()"
    />
  } @else {
    <!-- <tui-carousel #carousel [duration]="5000" [(index)]="index"> -->
    <tui-icon icon="@tui.arrow-down" size="xs" class="arrow-icon" />
    <div class="carousel__wrapper">
      <tui-carousel #carousel direction="vertical" [(index)]="index">
        <section *tuiItem="let index" appearance="neutral">
          @let current = evolutionChain()?.children!.at(index % evolutionChain()?.children!.length);
          <left-paw-evolution-chain-item [evolutionChain]="current" [activeName]="activeName()" />
        </section>
      </tui-carousel>
      <button
        iconStart="@tui.chevron-left"
        size="xs"
        tuiButton
        tuiIconButton
        appearance="textfield"
        type="button"
        [disabled]="index() === 0"
        (click)="carousel.prev()"
      >
        Previous
      </button>
      <button
        iconStart="@tui.chevron-right"
        size="xs"
        tuiButton
        tuiIconButton
        appearance="textfield"
        type="button"
        [disabled]="index() === 5"
        (click)="carousel.next()"
      >
        Next
      </button>
    </div>
  }
}
