<figure class="profile_pokemon__intro">
  <img
    class="profile_pokemon__image"
    [src]="pokemonProfileData()?.sprites?.other?.['official-artwork']?.front_default"
    [alt]="pokemonProfileData()?.name"
  />
  <figcaption class="profile_pokemon__intro_information">
    <div class="profile__line-left">
      <h2 class="profile__name">{{ pokemonProfileData()?.name }}</h2>
      <p class="profile__id">#{{ pokemonProfileData()?.id }}</p>
    </div>
    <div class="profile__line-left">
      @for (item of pokemonProfileData()?.types; track item.type.name) {
        <span className="profile__type profile__type-{{ item.type.name }}" tuiBadge>{{
          item.type.name
        }}</span>
      }
    </div>
    <div class="profile__line-left">
      @for (item of pokemonProfileData()?.abilities; track item.ability?.name) {
        <span
          [class]="
            item.is_hidden
              ? 'profile__ability profile__ability-hidden'
              : 'profile__ability profile__ability-visible'
          "
          tuiBadge
          >{{ item.ability?.name }}</span
        >
      }
    </div>
    <p>{{ pokemonProfileDataSpecies()?.flavor_text_entries?.[0]?.flavor_text }}</p>
    <div class="profile__line-left">
      <p class="profile__param">
        <span class="profile__param-name">Weight:</span> {{ pokemonWeight() }} kg
      </p>
      <p class="profile__param">
        <span class="profile__param-name">Height:</span> {{ pokemonHeight() }} m
      </p>
    </div>
    <button class="profile__button" tuiButton size="m" appearance="brand-accent">
      Add to favorites
    </button>
    <button class="profile__button" tuiButton size="m" appearance="brand-accent">Catch</button>
  </figcaption>
</figure>
<section class="profile__pokemon_stats">
  <h3 class="profile__pokemon_sec_heading">Battle Stats</h3>
  <div class="profile__pokemon_stats_content">
    <div class="profile__pokemon_stats_items">
      @for (item of pokemonProfileData()?.stats; track item.stat.name) {
        <div class="profile__line-stats">
          <p class="profile_stats__name">{{ item.stat.name }}</p>
          <p class="profile_stats__value">{{ item.base_stat }}</p>
          <progress
            class="profile_stats__bar profile_stats__bar-{{ item.stat.name }}"
            max="300"
            tuiProgressBar
            [value]="item.base_stat"
          ></progress>
        </div>
      }
      <div class="profile__line-stats profile__line-total">
        <p class="profile_stats__name">Total:</p>
        <p class="profile_stats__value">{{ pokemonTotalStats() }}</p>
      </div>
    </div>
    <div class="profile__pokemon_stats_radar">
      <tui-arc-chart
        size="xl"
        [max]="300"
        [minLabel]="'0'"
        [maxLabel]="'300'"
        class="profile__pokemon_chart"
        [value]="chartValue"
      />
    </div>
  </div>
</section>
