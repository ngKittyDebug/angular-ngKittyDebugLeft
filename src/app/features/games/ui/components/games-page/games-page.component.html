<section *transloco="let t; prefix: 'games'" class="games-container">
  <h1 class="games-heading">{{ t('title') }}</h1>
  <ul class="games-grid">
    @for (game of gamesList; track game.id) {
      <li class="games-grid__item">
        <left-paw-game-card [game]="game" />
      </li>
    }
  </ul>
</section>
