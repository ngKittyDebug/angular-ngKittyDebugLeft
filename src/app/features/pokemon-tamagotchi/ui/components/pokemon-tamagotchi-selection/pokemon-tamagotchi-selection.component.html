<section *transloco="let t; prefix: 'pokemonTamagotchi.selection'" class="tamagotchi-selection">
  @if (feedback(); as status) {
    <div
      size="m"
      tuiNotification
      [appearance]="status === 'saved' ? 'positive' : 'negative'"
      [icon]="status === 'saved' ? '@tui.check' : '@tui.alert-circle'"
    >
      @if (status === 'saved') {
        {{ t('savedMessage', { name: pokemonName() }) }}
      } @else if (status === 'evolvedPokemon') {
        {{ t('evolvedPokemonError') }}
      } @else {
        {{ t('loadFailedError') }}
      }
    </div>
  }

  <div class="tamagotchi-selection__actions">
    <button
      appearance="primary"
      size="m"
      tuiButton
      type="button"
      [disabled]="loading() || isCurrentSelection()"
      (click)="selectForTamagotchi()"
    >
      {{ isCurrentSelection() ? t('alreadySelected') : t('selectButton') }}
    </button>

    @if (isCurrentSelection()) {
      <a [routerLink]="tamagotchiRoute" appearance="outline" tuiButton type="button">
        {{ t('openTamagotchi') }}
      </a>
    }
  </div>
</section>
