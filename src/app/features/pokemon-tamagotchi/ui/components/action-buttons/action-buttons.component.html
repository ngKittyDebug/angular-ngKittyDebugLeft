<div *transloco="let t; prefix: 'pokemonTamagotchi.actions'" class="action-buttons">
  @for (button of buttons(); track button.action) {
    <button
      appearance="secondary"
      size="m"
      tuiButton
      type="button"
      class="action-buttons__btn"
      [attr.aria-disabled]="button.disabled ? true : null"
      [attr.aria-label]="
        button.disabled
          ? button.cooldownSeconds
            ? t('cooldownAria', { action: t(button.labelKey), seconds: button.cooldownSeconds })
            : button.disabledReasonKey
              ? t('disabledAria', {
                  action: t(button.labelKey),
                  reason: t(button.disabledReasonKey),
                })
              : t(button.labelKey)
          : null
      "
      [class.action-buttons__btn--unavailable]="button.disabled"
      [iconStart]="button.icon"
      [tuiHint]="
        button.cooldownSeconds
          ? t('cooldown', { seconds: button.cooldownSeconds })
          : button.disabledReasonKey
            ? t(button.disabledReasonKey)
            : ''
      "
      (click)="onAction(button.action, button.disabled)"
    >
      {{ t(button.labelKey) }}
    </button>
  }
</div>
