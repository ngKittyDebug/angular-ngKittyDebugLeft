<section
  *transloco="let t; prefix: 'pokemonTamagotchi.appearance'"
  class="appearance-settings"
  [attr.aria-label]="t('ariaLabel')"
>
  <h2 class="appearance-settings__title">{{ t('title') }}</h2>

  <div class="appearance-settings__group">
    <p class="appearance-settings__label">{{ t('spriteVariationLabel') }}</p>
    <div class="appearance-settings__options">
      @for (variation of spriteVariations; track variation) {
        <button
          appearance="flat"
          size="s"
          tuiButton
          type="button"
          [class.appearance-settings__option--active]="
            customization().spriteVariation === variation
          "
          (click)="onSpriteVariationChange(variation)"
        >
          {{ t('spriteVariations.' + variation) }}
        </button>
      }
    </div>
  </div>

  <div class="appearance-settings__group">
    <p class="appearance-settings__label">{{ t('stageThemeLabel') }}</p>
    <div class="appearance-settings__options">
      @for (theme of stageThemes; track theme) {
        <button
          appearance="flat"
          size="s"
          tuiButton
          type="button"
          [class.appearance-settings__option--active]="customization().stageTheme === theme"
          (click)="onStageThemeChange(theme)"
        >
          {{ t('stageThemes.' + theme) }}
        </button>
      }
    </div>
  </div>
</section>
