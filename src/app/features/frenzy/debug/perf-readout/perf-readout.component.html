<!-- Screen-space corner panel of the enabled perf metrics. Non-interactive, aria-hidden — a real-time visual-only
     aid (the authoritative readout for AT is the HUD/leaderboard). Rendered only under ?debug=perf. -->
<div class="perf-readout" aria-hidden="true">
  @for (row of rows(); track row.key) {
    <span
      class="perf-readout__metric"
      [class.perf-readout__metric--warn]="row.tone === 'warn'"
      [class.perf-readout__metric--bad]="row.tone === 'bad'"
      >{{ row.label }} {{ row.text }}</span
    >
  }
</div>
