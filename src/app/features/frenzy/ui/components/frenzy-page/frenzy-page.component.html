<main class="frenzy-page" [class.frenzy-page--mobile]="isMobile()">
  <left-paw-scene
    class="frenzy-page__scene"
    [players]="players()"
    [items]="items()"
    [myId]="myId()"
    [evolvingPlayers]="evolvingPlayers()"
    [ownedFloats]="ownedFloats()"
    [orphanFloats]="orphanFloats()"
    [blasts]="blasts()"
    [hitBursts]="hitBursts()"
    [ownedSparks]="ownedSparks()"
    [ownedShieldBlocks]="ownedShieldBlocks()"
    (itemClick)="handleItemClick($event)"
    (selfPoke)="handleSelfPoke()"
    (steer)="handleSteer($event)"
  />

  @if (isReconnecting()) {
    <p
      *transloco="let t; prefix: 'frenzy.connection'"
      class="frenzy-page__reconnecting"
      role="status"
      aria-live="polite"
    >
      {{ t('reconnecting') }}
    </p>
  }

  @if (me(); as myself) {
    <div class="frenzy-page__hud-left">
      <left-paw-current-pokemon-status
        [name]="myself.name"
        [hp]="myself.hp"
        [stage]="myself.stage"
        [body]="myself.body"
        [compact]="isMobile()"
      />
      <left-paw-minimap
        [players]="players()"
        [items]="items()"
        [myId]="myId()"
        [online]="presenceCount()"
        [disconnected]="disconnectedCount()"
        [compact]="isMobile()"
      />
    </div>
  }

  <div class="frenzy-page__hud-top-right">
    <div class="frenzy-page__hud-row">
      <left-paw-sound-toggle [compact]="isMobile()" />
    </div>
    <left-paw-leaderboard [entries]="leaderboard()" [myId]="myId()" [compact]="isMobile()" />
  </div>

  <div class="frenzy-page__overlay" *transloco="let t; prefix: 'frenzy.connection'">
    @switch (uiState()) {
      @case ('connecting') {
        <p class="frenzy-page__status">{{ t('connecting') }}</p>
      }
      @case ('roomFull') {
        <p class="frenzy-page__status">{{ t('roomFull') }}</p>
      }
      @case ('closed') {
        <div class="frenzy-page__backdrop"></div>
        <left-paw-disconnected-modal />
      }
      @case ('fainted') {
        <left-paw-fainted-modal
          [stats]="faintedStats()"
          [epitaph]="faintedEpitaph()"
          [respawnReady]="respawnReady()"
          [cooldownSeconds]="cooldownSeconds()"
          (respawn)="handleRespawn()"
          (chooseNew)="handleChooseNew()"
        />
      }
      @case ('picking') {
        <left-paw-pokemon-picker
          [error]="joinError()"
          (submitPicker)="handlePickerSubmit($event)"
        />
      }
    }
  </div>
</main>

<span class="frenzy-page__floor" *transloco="let t; prefix: 'frenzy.scene'" aria-hidden="true">{{
  t('floorLabel')
}}</span>
