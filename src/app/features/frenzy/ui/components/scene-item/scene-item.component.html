@if (item().landed) {
  <span class="scene__item-shadow" aria-hidden="true"></span>
}

<button
  class="scene__item"
  [class.scene__item--bomb]="item().type === 'bomb'"
  [class.scene__item--landed]="item().landed"
  [style.clip-path]="buriedClip()"
  type="button"
  tabindex="-1"
  (click)="clicked.emit($event)"
>
  @if (item().type === 'bomb') {
    <!-- Sea mine inlined (not an <img [src]>) so the sensor running-lights can be driven from `--sensor-speed`,
         which this component derives per-frame from the mine's remaining click budget. -->
    <svg
      class="scene__item-sprite scene__item-sprite--bomb"
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 96 96"
      role="img"
      aria-label="Sea mine"
    >
      <defs>
        <radialGradient id="mineBody" cx="0.38" cy="0.32" r="0.78">
          <stop offset="0" stop-color="#7c8b9e" />
          <stop offset="0.5" stop-color="#3a4654" />
          <stop offset="1" stop-color="#161d26" />
        </radialGradient>
        <radialGradient id="mineGloss" cx="0.36" cy="0.3" r="0.5">
          <stop offset="0" stop-color="#ffffff" stop-opacity="0.62" />
          <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
        </radialGradient>
        <radialGradient id="sensorGlow" cx="0.5" cy="0.5" r="0.5">
          <stop offset="0" stop-color="#ff7a2a" stop-opacity="0.95" />
          <stop offset="1" stop-color="#ff7a2a" stop-opacity="0" />
        </radialGradient>
      </defs>

      <!-- Horns: stubby steel cylinders radiating from behind the shell, each capped by a sensor light. -->
      <g stroke="#46535f" stroke-width="5.5" stroke-linecap="round">
        <line x1="78" y1="48" x2="87" y2="48" />
        <line x1="69.2" y1="69.2" x2="75.6" y2="75.6" />
        <line x1="48" y1="78" x2="48" y2="87" />
        <line x1="26.8" y1="69.2" x2="20.4" y2="75.6" />
        <line x1="18" y1="48" x2="9" y2="48" />
        <line x1="26.8" y1="26.8" x2="20.4" y2="20.4" />
        <line x1="48" y1="18" x2="48" y2="9" />
        <line x1="69.2" y1="26.8" x2="75.6" y2="20.4" />
      </g>

      <!-- Body: a large round mine shell with a faint equatorial seam and a top-left gloss. -->
      <circle cx="48" cy="48" r="30" fill="url(#mineBody)" stroke="#0e1620" stroke-width="2.5" />
      <circle
        cx="48"
        cy="48"
        r="20"
        fill="none"
        stroke="#0e1620"
        stroke-width="1.3"
        opacity="0.3"
      />
      <circle cx="48" cy="48" r="30" fill="url(#mineGloss)" />

      <!-- Sensor lights at the horn tips, lighting up one after another around the ring (chase clockwise). -->
      <g class="sensor s0">
        <circle cx="87" cy="48" r="5" fill="url(#sensorGlow)" />
        <circle cx="87" cy="48" r="2.4" fill="#ffb27a" />
      </g>
      <g class="sensor s1">
        <circle cx="75.6" cy="75.6" r="5" fill="url(#sensorGlow)" />
        <circle cx="75.6" cy="75.6" r="2.4" fill="#ffb27a" />
      </g>
      <g class="sensor s2">
        <circle cx="48" cy="87" r="5" fill="url(#sensorGlow)" />
        <circle cx="48" cy="87" r="2.4" fill="#ffb27a" />
      </g>
      <g class="sensor s3">
        <circle cx="20.4" cy="75.6" r="5" fill="url(#sensorGlow)" />
        <circle cx="20.4" cy="75.6" r="2.4" fill="#ffb27a" />
      </g>
      <g class="sensor s4">
        <circle cx="9" cy="48" r="5" fill="url(#sensorGlow)" />
        <circle cx="9" cy="48" r="2.4" fill="#ffb27a" />
      </g>
      <g class="sensor s5">
        <circle cx="20.4" cy="20.4" r="5" fill="url(#sensorGlow)" />
        <circle cx="20.4" cy="20.4" r="2.4" fill="#ffb27a" />
      </g>
      <g class="sensor s6">
        <circle cx="48" cy="9" r="5" fill="url(#sensorGlow)" />
        <circle cx="48" cy="9" r="2.4" fill="#ffb27a" />
      </g>
      <g class="sensor s7">
        <circle cx="75.6" cy="20.4" r="5" fill="url(#sensorGlow)" />
        <circle cx="75.6" cy="20.4" r="2.4" fill="#ffb27a" />
      </g>
    </svg>
  } @else {
    <img
      #sprite
      class="scene__item-sprite"
      [class.scene__item-sprite--spin]="item().type !== 'shield' && !frozen()"
      [class.scene__item-sprite--sway]="item().type === 'shield' && !frozen()"
      [class.scene__item-sprite--rock]="item().type === 'rock'"
      [class.scene__item-sprite--rotten]="item().type === 'rotten'"
      [style.animation-duration]="
        item().type === 'shield'
          ? item().spinDurationMs + 'ms'
          : item().spinDurationMs + 'ms, ' + breatheMs + 'ms'
      "
      [style.animation-direction]="item().spinReverse ? 'reverse' : 'normal'"
      [style.animation-play-state]="item().landed ? 'paused' : 'running'"
      [style.transform]="frozenTransform()"
      [src]="item().type | itemSprite"
      draggable="false"
      alt=""
    />
  }
</button>
