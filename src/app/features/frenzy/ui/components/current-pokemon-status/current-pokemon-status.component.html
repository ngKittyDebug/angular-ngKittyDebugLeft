<section
  *transloco="let t; prefix: 'frenzy.currentPokemonStatus'"
  class="current-pokemon-status"
  role="status"
  [class.current-pokemon-status--compact]="compact()"
  [attr.aria-label]="t('ariaLabel')"
>
  <!-- HP as a rounded corner badge (tinted by HP tone — green → amber → red, like the bar). Pulled out of the
       foot row so a 3-digit value can never overflow the fixed-width card; pinned to the top-left corner. -->
  <span
    class="current-pokemon-status__hp-badge"
    [style.background]="hp() | hpToneColor"
    [leftPawHpFlash]="hp()"
  >
    <span class="current-pokemon-status__hp-value">{{ hp() }}</span>
    <span class="current-pokemon-status__hp-unit">{{ t('hpLabel') }}</span>
  </span>

  <!-- Evolution stage as the mirror of the HP badge: same chip metrics + font (shared rule), pinned top-right. -->
  <span class="current-pokemon-status__stage-badge">{{ t('stageBadge', { stage: stage() }) }}</span>

  <span
    tuiAvatar
    size="m"
    class="current-pokemon-status__avatar"
    [attr.aria-label]="t('mood.' + mood())"
  >
    <img [src]="moodSprite()" alt="" draggable="false" />
  </span>

  <div class="current-pokemon-status__body">
    <div class="current-pokemon-status__head">
      <span class="current-pokemon-status__name">{{ name() }}</span>
    </div>

    <div class="current-pokemon-status__bar-wrap">
      <progress
        tuiProgressBar
        class="current-pokemon-status__bar"
        size="s"
        [value]="hp()"
        [max]="maxHp"
        [color]="hp() | hpToneColor"
      ></progress>
      <!-- Evolution marker: a notch on the absolute 0→max bar at the next-evolution threshold; gone on the
           final stage (along with the "until evolution" line). -->
      @if (untilEvolution() !== null) {
        <span
          class="current-pokemon-status__tick"
          aria-hidden="true"
          [style.left.%]="thresholdPercent()"
        ></span>
      }
    </div>

    @if (untilEvolution() !== null) {
      <div class="current-pokemon-status__foot">
        <span class="current-pokemon-status__until">
          {{ t('untilEvolution', { value: untilEvolution() }) }}
        </span>
      </div>
    }
  </div>
</section>
