@if (count() > 0) {
  <span
    *transloco="let t; prefix: 'frenzy.presence'"
    class="offline-participants"
    role="status"
    [tuiHint]="compact() ? null : t('disconnectedAriaLabel')"
    [attr.aria-label]="t('disconnectedAriaLabel')"
  >
    <tui-icon icon="@tui.wifi-off" />
    <span class="offline-participants__text">
      @if (compact()) {
        {{ count() }}
      } @else {
        {{ t('disconnected', { count: count() }) }}
      }
    </span>
  </span>
}
