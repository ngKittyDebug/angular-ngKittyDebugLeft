<ng-container *transloco="let t; prefix: 'frenzy.scene'">
  @for (aura of player().effectAuras; track aura) {
    @if (aura === shieldAuraClass()) {
      <span
        [class]="aura"
        [class.scene__shield--pulse]="shieldBlocks().length > 0"
        leftPawBubbleSkin
        aria-hidden="true"
      ></span>
    } @else {
      <span [class]="aura" aria-hidden="true"></span>
    }
  }

  @if (player().isMe) {
    <button
      class="scene__poke"
      type="button"
      [attr.aria-label]="t('pokeAriaLabel')"
      (click)="poke.emit()"
    >
      <ng-container [ngTemplateOutlet]="sprite" />
    </button>
  } @else {
    <ng-container [ngTemplateOutlet]="sprite" />
  }

  <span class="scene__label">{{ player().label }}</span>

  @if (!player().isMe) {
    <progress
      tuiProgressBar
      class="scene__hp-bar"
      size="xs"
      [value]="player().hp"
      [max]="maxHp()"
      [color]="player().hp | hpToneColor"
    ></progress>
  }

  @for (float of floats(); track float.id) {
    <left-paw-floating-text
      class="scene__player-float"
      [icon]="float.icon"
      [who]="float.who"
      [text]="t(float.textKey)"
      [delta]="float.delta"
      [tone]="float.tone"
      [durationMs]="float.durationMs"
    />
  }

  @for (spark of sparks(); track spark.id) {
    <left-paw-spark-burst class="scene__player-spark" />
  }
</ng-container>

<ng-template #sprite>
  <span class="scene__sprite-flip" [class.scene__sprite-flip--right]="player().facingRight">
    <!-- Centring offset: shifts the full art so the body (hitbox) sits on the actor point. Inside the flip wrapper
         so the horizontal offset mirrors with facing; separate from the img's own evolve-pulse transform. -->
    <span class="scene__sprite-offset">
      <img
        class="scene__sprite"
        [class.scene__sprite--evolving]="player().isEvolving"
        [class.scene__sprite--sad]="player().isSad"
        [src]="player().appearance | pokemonSprite: player().stage"
        [alt]="player().label"
        draggable="false"
      />
    </span>
  </span>
</ng-template>
