<section class="picker" *transloco="let t; prefix: 'frenzy.picker'">
  <label class="picker__name">
    <span class="picker__label">{{ t('nameLabel') }}</span>
    <input
      class="picker__input"
      type="text"
      maxlength="24"
      [placeholder]="t('namePlaceholder')"
      [value]="name()"
      (input)="onNameInput($event)"
    />
  </label>

  <div class="picker__lines">
    @for (option of lineOptions; track option.id) {
      <button
        type="button"
        class="picker__line"
        [class.picker__line--selected]="selectedLine() === option.id"
        (click)="select(option.id)"
      >
        <img
          class="picker__sprite"
          [src]="option.id | pokemonSprite"
          [alt]="option.label"
          draggable="false"
        />
        <span class="picker__name-label">{{ option.label }}</span>
      </button>
    }
  </div>

  @if (error(); as reason) {
    <p class="picker__error" role="alert" *transloco="let t; prefix: 'frenzy.joinError'">
      {{ t(reason) }}
    </p>
  }

  <button type="button" class="picker__submit" [disabled]="!canSubmit()" (click)="submit()">
    {{ t('submit') }}
  </button>
</section>
