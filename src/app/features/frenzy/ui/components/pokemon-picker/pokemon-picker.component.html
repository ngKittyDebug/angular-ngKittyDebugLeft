<section class="picker">
  <h2 class="picker__title">Choose your Pokémon</h2>

  <label class="picker__name">
    <span class="picker__label">Your name</span>
    <input
      class="picker__input"
      type="text"
      maxlength="24"
      placeholder="trainer"
      [value]="name()"
      (input)="onNameInput($event)"
    />
  </label>

  <div class="picker__lines">
    @for (option of lineOptions; track option.id) {
      <button
        type="button"
        class="picker__line"
        [class.picker__line--selected]="selectedLine() === option.id"
        (click)="select(option.id)"
      >
        <img class="picker__sprite" [src]="option.id | pokemonSprite" [alt]="option.label" />
        <span class="picker__name-label">{{ option.label }}</span>
      </button>
    }
  </div>

  <button type="button" class="picker__submit" [disabled]="!canSubmit()" (click)="submit()">
    Join the frenzy
  </button>
</section>
