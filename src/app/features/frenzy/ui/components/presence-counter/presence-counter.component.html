<section *transloco="let t; prefix: 'frenzy.presence'" class="presence-counter" role="status">
  <span
    class="presence-counter__chip presence-counter__chip--online"
    [tuiHint]="compact() ? null : t('onlineAriaLabel')"
    [attr.aria-label]="t('onlineAriaLabel')"
  >
    <tui-icon icon="@tui.users-round" />
    <span class="presence-counter__text">
      @if (compact()) {
        {{ online() }}
      } @else {
        {{ t('online', { count: online() }) }}
      }
    </span>
  </span>
  @if (disconnected() > 0) {
    <span
      class="presence-counter__chip presence-counter__chip--away"
      [tuiHint]="compact() ? null : t('disconnectedAriaLabel')"
      [attr.aria-label]="t('disconnectedAriaLabel')"
    >
      <tui-icon icon="@tui.wifi-off" />
      <span class="presence-counter__text">
        @if (compact()) {
          {{ disconnected() }}
        } @else {
          {{ t('disconnected', { count: disconnected() }) }}
        }
      </span>
    </span>
  }
</section>
