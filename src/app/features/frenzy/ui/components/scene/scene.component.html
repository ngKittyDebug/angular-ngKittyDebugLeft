<section
  *transloco="let t; prefix: 'frenzy.scene'"
  class="scene"
  [class.scene--shaking]="blasts().length > 0"
  aria-label="Feeding frenzy scene"
  (pointerdown)="onScenePointerDown($event)"
>
  <div
    class="scene__world"
    #world
    [style.width.px]="worldWidth"
    [style.height.px]="worldHeight"
    [style.--scene-item-size]="itemSize"
  >
    <left-paw-aquarium-decor />

    @for (item of renderedItems(); track item.id) {
      <left-paw-scene-item
        [leftPawScenePosition]="{ x: item.x, y: item.y }"
        [scenePositionTransform]="true"
        [item]="item"
        (clicked)="onItemClick(item, $event)"
      />
    }

    @for (float of orphanFloats(); track float.id) {
      <left-paw-floating-text
        [leftPawScenePosition]="{ x: float.x, y: float.y }"
        [scenePositionClampX]="true"
        [icon]="float.icon"
        [who]="float.who"
        [text]="t(float.textKey)"
        [delta]="float.delta"
        [tone]="float.tone"
        [durationMs]="float.durationMs"
      />
    }

    @for (player of renderedPlayers(); track player.id) {
      <left-paw-scene-player
        [leftPawScenePosition]="{ x: player.x, y: player.y }"
        [scenePositionTransform]="true"
        [player]="player"
        [floats]="floatsByOwner().get(player.id) ?? []"
        [maxHp]="maxHp"
        [shieldAuraClass]="shieldAuraClass"
        (poke)="onSelfPoke()"
      />
    }

    @for (burst of bursts(); track burst.id) {
      <left-paw-bubble-burst [leftPawScenePosition]="{ x: burst.x, y: burst.y }" />
    }

    @for (blast of blasts(); track blast.id) {
      <div
        class="scene__blast"
        aria-hidden="true"
        [leftPawScenePosition]="{ x: blast.x, y: blast.y }"
        [style.width.%]="blast.radius * 200"
      >
        <span class="scene__blast-ring"></span>
        <span class="scene__blast-ring scene__blast-ring--secondary"></span>
        <span class="scene__blast-smoke"></span>
        <span class="scene__blast-core"></span>
        <span class="scene__blast-flash"></span>
        <span class="scene__blast-sparks"></span>
      </div>
    }
  </div>

  <!-- Foreground parallax: faint particle layers in front of the world that scroll faster than it (camera-driven
       via background-position), giving a depth/direction cue over uniform mid-water. Decorative only. -->
  <div class="scene__parallax scene__parallax--mid" #parallaxMid aria-hidden="true"></div>
  <div class="scene__parallax scene__parallax--near" #parallaxNear aria-hidden="true"></div>
</section>
