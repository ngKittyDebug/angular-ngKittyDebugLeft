<div class="aq" aria-hidden="true">
  <div class="aq__floor"></div>

  <!-- Rays, motes and bubbles carry no inline styles: all per-element variety
       (position, size, timing) is computed in the stylesheet via :nth-child. -->
  <div class="aq__rays">
    <span class="aq__ray"></span>
    <span class="aq__ray"></span>
    <span class="aq__ray"></span>
    <span class="aq__ray"></span>
    <span class="aq__ray"></span>
  </div>

  <div class="aq__plankton">
    <span class="aq__mote"></span>
    <span class="aq__mote"></span>
    <span class="aq__mote"></span>
    <span class="aq__mote"></span>
    <span class="aq__mote"></span>
    <span class="aq__mote"></span>
    <span class="aq__mote"></span>
    <span class="aq__mote"></span>
    <span class="aq__mote"></span>
    <span class="aq__mote"></span>
    <span class="aq__mote"></span>
    <span class="aq__mote"></span>
    <span class="aq__mote"></span>
    <span class="aq__mote"></span>
    <span class="aq__mote"></span>
    <span class="aq__mote"></span>
  </div>

  <div class="aq__plants">
    @for (plant of plants(); track $index) {
      <div
        class="aq__plant"
        [style.left.%]="plant.left"
        [style.color]="plant.color"
        [style.z-index]="plant.zIndex"
        [style.--h]="plant.height + 'px'"
        [style.--w]="plant.width + 'px'"
        [style.--root]="plant.root + '%'"
        [style.--rot]="plant.rotation + 'deg'"
        [style.filter]="'brightness(' + plant.brightness + ') blur(' + plant.blur + 'px)'"
        [style.animation-duration.s]="plant.duration"
        [style.animation-delay.s]="plant.delay"
      >
        <svg
          class="aq__blade"
          [class.aq__blade--coral]="plant.art.coral"
          [attr.viewBox]="plant.art.viewBox"
          preserveAspectRatio="none"
        >
          <path [attr.d]="plant.art.path" />
        </svg>
      </div>
    }
  </div>

  <div class="aq__bubbles">
    <span class="aq__bubble"></span>
    <span class="aq__bubble"></span>
    <span class="aq__bubble"></span>
    <span class="aq__bubble"></span>
    <span class="aq__bubble"></span>
    <span class="aq__bubble"></span>
    <span class="aq__bubble"></span>
    <span class="aq__bubble"></span>
    <span class="aq__bubble"></span>
    <span class="aq__bubble"></span>
    <span class="aq__bubble"></span>
    <span class="aq__bubble"></span>
  </div>

  <div class="aq__vignette"></div>
</div>
