<div class="aq" aria-hidden="true">
  <div class="aq__floor"></div>

  <!-- Rays, motes and bubbles carry no inline styles: all per-element variety
       (position, size, timing) is computed in the stylesheet via :nth-child. -->
  <div class="aq__rays">
    <span class="aq__ray"></span>
    <span class="aq__ray"></span>
    <span class="aq__ray"></span>
    <span class="aq__ray"></span>
    <span class="aq__ray"></span>
  </div>

  <div class="aq__plankton">
    <span class="aq__mote"></span>
    <span class="aq__mote"></span>
    <span class="aq__mote"></span>
    <span class="aq__mote"></span>
    <span class="aq__mote"></span>
    <span class="aq__mote"></span>
    <span class="aq__mote"></span>
    <span class="aq__mote"></span>
    <span class="aq__mote"></span>
    <span class="aq__mote"></span>
    <span class="aq__mote"></span>
    <span class="aq__mote"></span>
    <span class="aq__mote"></span>
    <span class="aq__mote"></span>
    <span class="aq__mote"></span>
    <span class="aq__mote"></span>
  </div>

  <div class="aq__plants">
    @for (plant of plants(); track $index) {
      <div
        class="aq__plant"
        [style.left.%]="plant.left"
        [style.color]="plant.color"
        [style.z-index]="plant.zIndex"
        [style.--h]="plant.height + 'px'"
        [style.--rot]="plant.rotation + 'deg'"
        [style.filter]="'brightness(' + plant.brightness + ')'"
        [style.animation-duration.s]="plant.duration"
        [style.animation-delay.s]="plant.delay"
      >
        @switch (plant.shape) {
          @case (0) {
            <svg class="aq__blade" viewBox="0 0 60 160" preserveAspectRatio="none">
              <path
                d="M30 160 C 10 122 44 94 24 62 C 16 46 34 38 30 2 C 40 30 44 82 36 116 C 50 132 22 146 30 160 Z"
              />
            </svg>
          }
          @case (1) {
            <svg class="aq__blade" viewBox="0 0 60 160" preserveAspectRatio="none">
              <path
                d="M30 160 C 48 124 18 96 36 64 C 46 48 28 40 32 4 C 22 30 18 84 28 118 C 14 134 42 146 30 160 Z"
              />
            </svg>
          }
          @default {
            <svg class="aq__blade aq__blade--coral" viewBox="0 0 60 160" preserveAspectRatio="none">
              <path
                d="M30 160 C 30 120 8 112 12 72 C 4 94 0 62 14 58 C 8 42 24 50 26 80 C 30 62 34 62 34 86 C 38 52 54 58 48 78 C 60 66 56 98 46 98 C 52 124 30 124 30 160 Z"
              />
            </svg>
          }
        }
      </div>
    }
  </div>

  <div class="aq__bubbles">
    <span class="aq__bubble"></span>
    <span class="aq__bubble"></span>
    <span class="aq__bubble"></span>
    <span class="aq__bubble"></span>
    <span class="aq__bubble"></span>
    <span class="aq__bubble"></span>
    <span class="aq__bubble"></span>
    <span class="aq__bubble"></span>
    <span class="aq__bubble"></span>
    <span class="aq__bubble"></span>
    <span class="aq__bubble"></span>
    <span class="aq__bubble"></span>
  </div>

  <div class="aq__vignette"></div>
</div>
