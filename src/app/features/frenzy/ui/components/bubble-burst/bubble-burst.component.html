<span class="bubble-burst" aria-hidden="true">
  @for (dot of dots; track $index) {
    <span
      class="bubble-burst__dot"
      [style.width.px]="dot.size"
      [style.height.px]="dot.size"
      [style.--bx]="dot.offsetX + 'px'"
      [style.--by]="dot.offsetY + 'px'"
      [style.animation-delay.s]="dot.delay"
    ></span>
  }
</span>
