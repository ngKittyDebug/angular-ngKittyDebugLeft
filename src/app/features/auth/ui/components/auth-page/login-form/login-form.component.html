@let loginForm = this.loginFormGroup;

<form
  *transloco="let t"
  tuiAppearance="floating"
  tuiForm="m"
  class="login__form"
  [formGroup]="loginForm"
  (ngSubmit)="submit()"
>
  <div class="login__title-wrapper">
    <h2 class="login__title" tuiTitle>{{ t('auth.login.heading') }}</h2>
    <p class="login__subtitle" tuiSubtitle>{{ t('auth.login.subheading') }}</p>
  </div>
  <div class="login__inputs">
    <tui-textfield class="login__textfield" iconStart="@tui.user">
      <label tuiLabel for="username">{{ t('auth.login.username') }}</label>
      <input
        formControlName="nameOrEmailFormControl"
        placeholder="John"
        tuiInput
        autocomplete="username"
        type="text"
        id="username"
      />
    </tui-textfield>
    <tui-error />
    <tui-textfield class="login__textfield" iconStart="@tui.lock">
      <label tuiLabel for="password">{{ t('auth.login.password') }}</label>
      <input
        formControlName="passwordFormControl"
        placeholder="333333Qq"
        tuiInput
        autocomplete="current-password"
        type="password"
        id="password"
      />
    </tui-textfield>
    <tui-error />
  </div>
  <button
    class="login__form_button"
    tuiButton
    appearance="brand-accent"
    type="submit"
    [disabled]="loginForm.invalid"
  >
    {{ t('auth.login.button') }}
  </button>
  <div class="login__title-wrapper">
    <p class="login__form_text">
      {{ t('auth.login.endingText') }}
      <a [routerLink]="['/auth', 'signup']" tuiLink class="login__form_link">{{
        t('auth.login.loginLink')
      }}</a>
    </p>
  </div>
</form>
