<div *transloco="let t" class="not-found-container">
  <h1 class="not-found-heading">{{ t('notFound.heading') }}</h1>
  <p class="not-found-text">{{ t('notFound.text') }}</p>
  <img class="not-found-image" [src]="imageUrl" alt="poke ball 404" />
  <a
    class="not-found-button"
    tuiButton
    size="m"
    appearance="brand-accent"
    routerLink="/"
    iconStart="@tui.house"
  >
    {{ t('notFound.button') }}
  </a>
</div>
