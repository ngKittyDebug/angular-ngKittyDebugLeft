<section
  *transloco="let t; prefix: 'pokemonProfile.tamagotchiSelection'"
  class="tamagotchi-selection"
>
  @if (feedback(); as status) {
    <div
      size="m"
      tuiNotification
      [appearance]="status === 'saved' ? 'positive' : 'negative'"
      [icon]="status === 'saved' ? '@tui.check' : '@tui.alert-circle'"
    >
      @if (status === 'saved') {
        {{ t('savedMessage', { name: pokemonName() }) }}
      } @else if (status === 'evolvedPokemon') {
        {{ t('evolvedPokemonError') }}
      } @else {
        {{ t('loadFailedError') }}
      }
    </div>
  }

  <div class="tamagotchi-selection__actions">
    <button
      class="tamagotchi-selection__button"
      appearance="brand-accent"
      size="m"
      tuiButton
      type="button"
      [disabled]="loading() || isCurrentSelection()"
      (click)="onSelectClick()"
    >
      {{ isCurrentSelection() ? t('alreadySelected') : t('selectButton') }}
    </button>

    @if (isCurrentSelection()) {
      <a
        [routerLink]="tamagotchiRoute()"
        class="tamagotchi-selection__button"
        size="m"
        appearance="outline"
        tuiButton
        type="button"
      >
        {{ t('openTamagotchi') }}
      </a>
    }
  </div>
</section>
